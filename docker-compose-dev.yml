services:
  db:
    image: postgres:17.10
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?err}
      POSTGRES_USER: ${POSTGRES_USER:?err}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}

    volumes:
      - idempotent_api_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: idempotent-api

    command: python manage.py runserver 0.0.0.0:8000

    ports:
      - "8083:8000"

    volumes:
      - ./app:/app

    env_file:
      - .env

volumes:
  idempotent_api_postgres_data: