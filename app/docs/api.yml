openapi: 3.0.3
info:
  title: Idempotent Financial API
  version: 1.0.0
  description: A financial API demonstrating idempotent payment creation.
paths:
  /api/payments/:
    post:
      operationId: payments_create
      description: Creates a payment using an idempotency key. Repeating the same
        request with the same key returns the original response. Reusing the key with
        a different payload returns a conflict.
      summary: Create a payment
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Unique key identifying this payment operation.
        required: true
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSuccessResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        result:
          nullable: true
        success:
          type: boolean
        result_code:
          type: integer
        error:
          type: string
        validation_errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorResponse'
      required:
      - result_code
      - success
    PaymentCreate:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,0})?$
        currency:
          type: string
          maxLength: 3
        description:
          type: string
          default: ''
          maxLength: 255
      required:
      - amount
      - currency
    PaymentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,0})?$
          readOnly: true
        currency:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - currency
      - description
      - id
      - status
    PaymentSuccessResponse:
      type: object
      properties:
        result:
          $ref: '#/components/schemas/PaymentResponse'
        success:
          type: boolean
        result_code:
          type: integer
        error:
          type: string
          nullable: true
        validation_errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorResponse'
          nullable: true
      required:
      - result
      - result_code
      - success
    StatusEnum:
      enum:
      - SUCCESS
      - FAILED
      type: string
      description: |-
        * `SUCCESS` - Success
        * `FAILED` - Failed
    ValidationErrorResponse:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
      required:
      - field
      - message
